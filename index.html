<!DOCTYPE html> 
<html lang="ru"> 
<head> 
    <meta charset="UTF-8"> 
    <title>Моя фотогалерея</title> 
    <style>         body { 
            font-family: Arial, sans-serif;             background: #f0f0f0;             text-align: center; 
            padding: 20px; 
        }         h1 {             color: #333; 
        } 
        .gallery {             display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));             gap: 20px;             max-width: 1200px; 
            margin: 0 auto; 
        } 
        .photo-card {             background: white;             border-radius: 10px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);             overflow: hidden; 
            transition: transform 0.3s; 
        } 
        .photo-card:hover { 
            transform: scale(1.02); 
        } 
        .photo-card img {             width: 100%;             height: 200px; 
            object-fit: cover; 
        } 
        .photo-card p {             padding: 10px;             margin: 0;             font-size: 0.9rem; 
            color: #555; 
        } 
    </style> 
</head> 
<body> 


    
    <style>
    /* Стили для шапки */
    .site-header {
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        color: white;
        padding: 15px 20px;
        box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        position: sticky;
        top: 0;
        z-index: 1000;
    }
    .header-container {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
    }
    .logo {
        font-size: 1.8rem;
        font-weight: bold;
        letter-spacing: 1px;
    }
    .logo a {
        color: white;
        text-decoration: none;
        transition: color 0.3s;
    }
    .logo a:hover {
        color: #ffd700;
    }
    .nav-links {
        display: flex;
        gap: 30px;
        align-items: center;
    }
    .nav-links a {
        color: #f0f0f0;
        text-decoration: none;
        font-size: 1.1rem;
        transition: all 0.3s;
        padding: 8px 12px;
        border-radius: 8px;
    }
    .nav-links a:hover {
        background-color: rgba(255,255,255,0.2);
        color: #ffd700;
        transform: translateY(-2px);
    }
    .login-btn {
        background-color: #ff4757;
        padding: 8px 20px;
        border-radius: 30px;
        font-weight: bold;
    }
    .login-btn:hover {
        background-color: #ff6b81;
        color: white;
        transform: scale(1.05);
    }
    /* Адаптация для мобильных телефонов */
    @media (max-width: 768px) {
        .header-container {
            flex-direction: column;
            gap: 10px;
        }
        .nav-links {
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
    }
</style>

<header class="site-header">
    <div class="header-container">
        <div class="logo">
            <a href="index.html">Наша семья</a>
        </div>
        <div class="nav-links">
            <a href="glavnaya.html">Главная</a>
            <a href="search.html">Полезное</a>
            <a href="login.html" class="login-btn">Войти</a>
        </div>
    </div>
</header>


    
    <h1>📸 Мои любимые кадры</h1> 
    <div class="gallery"> 
        <div class="photo-card"> 
            <img src="1.jpg" alt="Фото 1"> 
            <p>Золотое кольцо</p> 
        </div> 
        <div class="photo-card"> 
            <img src="2.jpg" alt="Фото 2"> 
            <p>Молодожены</p> 
        </div> 
        <div class="photo-card"> 
            <img src="3.jpg" alt="Фото 3"> 
            <p>Санька</p> 
        </div> 
        <div class="photo-card"> 
            <img src="4.jpg" alt="Фото 4"> 
            <p>Борисоглебск</p> 
        </div> 
    </div> 
</body> 
</html>
